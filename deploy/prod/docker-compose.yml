# 生产 compose。与 .env 放在同一目录;WS_VERSION 等变量来自 .env。
name: workstation

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: workstation
      POSTGRES_DB: workstation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workstation -d workstation"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [ws-net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [ws-net]

  app:
    image: workstation-app:${WS_VERSION:?请在 .env 中设置 WS_VERSION}
    restart: unless-stopped
    command: ["app"]
    env_file: .env
    environment:
      WS_LOG_DIR: /var/log/workstation
    volumes:
      - ./data/logs:/var/log/workstation
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ws-net]

  scheduler:
    image: workstation-app:${WS_VERSION}
    restart: unless-stopped
    command: ["scheduler"]
    env_file: .env
    environment:
      WS_LOG_DIR: /var/log/workstation
    volumes:
      - ./data/logs:/var/log/workstation
    # 镜像自带的 HEALTHCHECK 检查 8080 端口,scheduler 不监听端口,关掉
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy
    networks: [ws-net]

  web:
    image: workstation-web:${WS_VERSION}
    restart: unless-stopped
    # 只传 Caddyfile 用到的变量,不把 .env 里的密钥交给 web 容器
    environment:
      WS_SITE_ADDRESS: ${WS_SITE_ADDRESS:-localhost}
      WS_ACME_EMAIL: ${WS_ACME_EMAIL:-}
    ports:
      - "${WS_HTTP_PORT:-80}:80"
      - "${WS_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - ./data/caddy:/data
    healthcheck:
      # Caddy 管理接口只监听容器内回环地址,能响应说明 Caddy 已加载配置
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/"]
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      app:
        condition: service_healthy
    networks: [ws-net]

networks:
  ws-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
