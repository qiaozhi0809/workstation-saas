# 生产 compose。与 .env 放在同一目录;WS_VERSION 等变量来自 .env。
name: workstation

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: workstation
      POSTGRES_DB: workstation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workstation -d workstation"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [ws-net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [ws-net]

  app:
    image: workstation-app:${WS_VERSION:?请在 .env 中设置 WS_VERSION}
    restart: unless-stopped
    command: ["app"]
    env_file: .env
    environment:
      WS_LOG_DIR: /var/log/workstation
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/logs:/var/log/workstation
      # stream-worker 写、app 只读:播放接口从这里发 HLS 片段
      - ws-hls:/run/ws-hls:ro
    # 只覆盖启动宽限期,其余(检查命令、间隔、重试次数)沿用镜像的 HEALTHCHECK:
    # app 启动时会自动做数据库迁移,数据量大时可能超过镜像里默认的 60 秒宽限期,
    # 过早判成 unhealthy 会让依赖它的 scheduler 起不来、安装 / 升级 / 恢复误报失败
    healthcheck:
      start_period: 300s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ws-net]

  scheduler:
    image: workstation-app:${WS_VERSION}
    restart: unless-stopped
    command: ["scheduler"]
    env_file: .env
    environment:
      WS_LOG_DIR: /var/log/workstation
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/logs:/var/log/workstation
    # 镜像自带的 HEALTHCHECK 检查 8080 端口,scheduler 不监听端口,关掉
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy
    networks: [ws-net]

  # 摄像头转流:RTSP -> HLS。只和 Redis、数据库、ws-hls 卷打交道;视频不出校,不需要外网
  stream-worker:
    image: workstation-stream:${WS_VERSION}
    restart: unless-stopped
    env_file: .env
    environment:
      WS_HLS_ROOT: /run/ws-hls
      TZ: ${TZ:-Asia/Shanghai}
    # 日志只写 stdout(docker logs / diagnose.sh 收集),不挂 data/logs;限制大小防止写满磁盘
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    # 退出时要依次停掉最多 10 路 ffmpeg
    stop_grace_period: 20s
    # 资源围栏:copy 模式每路约 0.1 核,转码每路约 1 核(-threads 2 封顶)。超限时只是这个容器变慢、
    # 画面卡顿,不会把 app / 数据库 / 定时任务一起拖垮;转码路数多时在 .env 里调大
    deploy:
      resources:
        limits:
          cpus: "${WS_STREAM_CPUS:-2}"
          memory: "${WS_STREAM_MEMORY:-2g}"
    volumes:
      - ws-hls:/run/ws-hls
    # 等 app 健康(迁移已完成,cameras 表已存在)再起
    depends_on:
      app:
        condition: service_healthy
    networks: [ws-net]

  web:
    image: workstation-web:${WS_VERSION}
    restart: unless-stopped
    # 只传 Caddyfile 用到的变量,不把 .env 里的密钥交给 web 容器
    environment:
      WS_SITE_ADDRESS: ${WS_SITE_ADDRESS:-localhost}
      WS_ACME_EMAIL: ${WS_ACME_EMAIL:-}
    ports:
      - "${WS_HTTP_PORT:-80}:80"
      - "${WS_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - ./data/caddy:/data
    healthcheck:
      # Caddy 管理接口只监听容器内回环地址,能响应说明 Caddy 已加载配置
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/"]
      interval: 3s
      timeout: 3s
      retries: 30
    # 不依赖 app:app 异常时,备份/恢复仍要能经 web 容器取到 data/ 的 tar
    networks: [ws-net]

volumes:
  # 内存盘:片段写盘不磨损硬盘,容器重启即清空;uid 与应用镜像的 ws 用户一致。
  # size 只是上限,tmpfs 按实际用量占内存。估算:每路最多 6 个 2 秒片段外加 ffmpeg 延迟删除的几个,
  # 主码流(1080p / 4K,copy)每路约 60–100 MB,子码流或 720p 转码每路不到 20 MB;
  # 10 路主码流约 1 GB,路数多或码率高时在 .env 里调大 WS_HLS_SIZE
  ws-hls:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=${WS_HLS_SIZE:-1g},uid=10001,gid=10001,mode=0755"

networks:
  ws-net:
    driver: bridge
    # 子网来自 .env 的 WS_SUBNET(install.sh 检测与本机路由是否重叠后写入;WS_TRUSTED_PROXIES 必须包含它)。
    # 不要只改这里:改子网要同时改 .env 的 WS_SUBNET 与 WS_TRUSTED_PROXIES,并 docker compose down 后再 up
    ipam:
      config:
        - subnet: ${WS_SUBNET:-172.30.0.0/24}
