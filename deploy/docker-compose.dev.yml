services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: workstation
      POSTGRES_PASSWORD: workstation
      POSTGRES_DB: workstation
    ports: ["5432:5432"]
    volumes: ["./data/pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workstation -d workstation"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: ["./data/redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # ---- 假摄像头(profile camera):只给开发 / CI 用,不进离线包 ----
  # docker compose -f deploy/docker-compose.dev.yml --profile camera up -d
  # 地址:rtsp://127.0.0.1:${WS_RTSP_PORT:-8554}/cam1(testsrc 彩条,25fps 1280x720)
  mediamtx:
    # v1.21.2,2026-10-08 发布
    image: bluenviron/mediamtx:1.21.2
    profiles: ["camera"]
    restart: unless-stopped
    ports: ["${WS_RTSP_PORT:-8554}:8554"]
  fake-camera:
    # ffmpeg 8.1.2(alpine 3.20),2026-08-30 发布
    image: jrottenberg/ffmpeg:8.1.2-alpine320
    profiles: ["camera"]
    restart: unless-stopped
    depends_on: [mediamtx]
    command: >
      -hide_banner -loglevel warning -re -f lavfi -i testsrc=size=1280x720:rate=25
      -c:v libx264 -preset ultrafast -tune zerolatency -g 50 -pix_fmt yuv420p
      -f rtsp -rtsp_transport tcp rtsp://mediamtx:8554/cam1
  # H.265 假摄像头:rtsp://127.0.0.1:${WS_RTSP_PORT:-8554}/cam2。CI 用来验证 H.265 探测与提示
  # (测试连接应报 video_codec=hevc、browser_playable=false 并给出换 H.264 子码流 / 转码的提示);
  # 若该镜像没有 libx265,换 linuxserver/ffmpeg
  fake-camera-hevc:
    image: jrottenberg/ffmpeg:8.1.2-alpine320
    profiles: ["camera"]
    restart: unless-stopped
    depends_on: [mediamtx]
    command: >
      -hide_banner -loglevel warning -re -f lavfi -i testsrc=size=1280x720:rate=25
      -c:v libx265 -preset ultrafast -tune zerolatency -g 50 -pix_fmt yuv420p
      -x265-params log-level=error
      -f rtsp -rtsp_transport tcp rtsp://mediamtx:8554/cam2
