[project]
name = "workstation-server"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36,<2.2",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.7",
  "pyjwt>=2.10",
  "bcrypt>=4.2",
  "redis>=5.2",
  "structlog>=24.4",
  "tzdata>=2026.6",
  "httpx>=0.28,<1",
  "cryptography>=44,<47",
  "pyotp==2.10.0",
  "segno==1.6.6",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "testcontainers[postgres,redis]>=4.9",
  "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "ffmpeg: 需要本机 ffmpeg 和假摄像头(docker compose --profile camera);缺少时 skip",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
