name: CI

# 纯文档改动不跑 CI。main 目前没开分支保护;以后若把 CI 设为必须通过的检查,
# 要改成任务级跳过(否则纯文档 PR 会一直等待检查)。
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'reference-html/**'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'reference-html/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      # setup-uv 不发布 v10 这类浮动大版本 tag,只能钉完整版本
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          working-directory: server
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      # testcontainers 在 runner 自带的 Docker 上起 postgres:16-alpine / redis:7-alpine
      - name: Pytest
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

      - name: Typecheck
        run: npx tsc -b

      - name: Vitest
        run: npm run test

  # Playwright e2e 冒烟:真实 Postgres/Redis + 后端 + Vite dev server(/api 代理到 8080)
  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workstation
          POSTGRES_PASSWORD: workstation
          POSTGRES_DB: workstation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workstation -d workstation"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # 与 deploy/docker-compose.dev.yml 和 server/app/config.py 的开发默认值一致
      WS_DATABASE_URL: postgresql+psycopg://workstation:workstation@localhost:5432/workstation
      WS_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          working-directory: server
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: uv sync --locked

      - name: Migrate and seed
        working-directory: server
        run: uv run alembic upgrade head && uv run python -m app.cli seed-dev

      # 假 AI 服务:只监听本机,E2E 绝不连外网;Key 是假值
      - name: Start fake LLM and configure AI
        working-directory: server
        run: |
          nohup node ../apps/web/e2e/helpers/fakeLlm.mjs > "$RUNNER_TEMP/fakellm.log" 2>&1 &
          printf 'test-key\n' | uv run python -m app.cli ai-config set --provider custom --base-url http://127.0.0.1:18089/v1 --model fake-model --api-key-stdin

      - name: Start backend
        working-directory: server
        run: |
          nohup uv run uvicorn --factory app.main:create_app --port 8080 > "$RUNNER_TEMP/backend.log" 2>&1 &

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Start frontend
        working-directory: apps/web
        run: |
          nohup npm run dev > "$RUNNER_TEMP/frontend.log" 2>&1 &

      - name: Wait for services
        run: |
          wait_for() {
            for _ in $(seq 1 60); do
              if curl -sf -o /dev/null "$1"; then
                echo "$1 is up"
                return 0
              fi
              sleep 2
            done
            echo "Timed out waiting for $1"
            echo "--- backend.log ---"; cat "$RUNNER_TEMP/backend.log" || true
            echo "--- frontend.log ---"; cat "$RUNNER_TEMP/frontend.log" || true
            echo "--- fakellm.log ---"; cat "$RUNNER_TEMP/fakellm.log" || true
            return 1
          }
          wait_for http://127.0.0.1:18089/last
          wait_for http://localhost:8080/api/v1/healthz
          wait_for http://localhost:5173/
          wait_for http://localhost:5173/api/v1/healthz

      - name: Playwright e2e
        working-directory: apps/web
        run: npm run e2e -- --trace retain-on-failure

      - name: Show service logs
        if: failure()
        run: |
          echo "--- backend.log ---"; cat "$RUNNER_TEMP/backend.log" || true
          echo "--- frontend.log ---"; cat "$RUNNER_TEMP/frontend.log" || true
          echo "--- fakellm.log ---"; cat "$RUNNER_TEMP/fakellm.log" || true

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore

  # 离线包 + 部署冒烟:构建 0.0.0-ci 离线包,解开后对解开的目录逐个跑部署测试
  # (真实 docker compose,端口 18080/18443,固定子网 172.30.0.0/24 → 脚本必须逐个跑,不能并行)
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # 显式 bash:-eo pipefail。默认的 `bash -e` 没有 pipefail,`脚本 | tee` 会吞掉脚本的退出码
    defaults:
      run:
        shell: bash
    env:
      WS_TEST_VERSION: 0.0.0-ci
      WS_TEST_PROJECT: ws-m5a-ci
      WS_HTTP_PORT: 18080
      WS_HTTPS_PORT: 18443
    steps:
      - uses: actions/checkout@v7

      # runner 自带 shellcheck;-S warning 与本地、计划一致
      - name: Shellcheck
        # -x 跟进 source(与段 B 本地一致)。再排除 SC2120:runner 上较新的 shellcheck 对 lib.sh 的 secret_values
        # (可选参数 ${1:-$ENV_FILE},调用者都不传)报警,加 -x 也没用;待 B 的 lib.sh 加 disable 注释后可去掉(E-7)
        run: shellcheck -S warning -x -e SC2120 deploy/prod/scripts/*.sh deploy/tests/*.sh deploy/release/*.sh

      - name: Build offline bundle
        run: deploy/release/build-bundle.sh "$WS_TEST_VERSION"

      - name: Bundle smoke
        run: deploy/tests/bundle_smoke.sh "$WS_TEST_VERSION"

      - name: Unpack bundle
        run: |
          mkdir -p "$RUNNER_TEMP/bundle"
          tar -xzf "dist/workstation-deploy-$WS_TEST_VERSION.tar.gz" -C "$RUNNER_TEMP/bundle"
          echo "WS_TEST_DEPLOY_SRC=$RUNNER_TEMP/bundle/workstation-deploy-$WS_TEST_VERSION" >> "$GITHUB_ENV"
          echo "WS_BUNDLE_PKG=$PWD/dist/workstation-deploy-$WS_TEST_VERSION.tar.gz" >> "$GITHUB_ENV"

      # 删掉本机构建出的镜像:离线包是唯一来源。bundle_upgrade 排在第一个,它真的 docker load 包里的镜像 tar,
      # 之后的测试沿用已载入的镜像(_common.sh 的 WS_INSTALL_SKIP_LOAD=1)
      - name: Remove locally built images
        run: docker image rm "workstation-app:$WS_TEST_VERSION" "workstation-web:$WS_TEST_VERSION" postgres:16-alpine redis:7-alpine

      # 一个脚本一个脚本地跑;每个脚本后台抓各服务日志,失败时作为 artifact 上传
      - name: Deploy tests
        run: |
          for t in bundle_upgrade install_fresh install_twice backup_restore restore_rejects upgrade_same upgrade_precheck_fail; do
            echo "::group::$t"
            stop="$RUNNER_TEMP/stop-$t"
            deploy/tests/bundle_collect_logs.sh "$WS_TEST_PROJECT" "$RUNNER_TEMP/service-logs/$t" "$stop" &
            collector=$!
            rc=0
            set +e
            "deploy/tests/$t.sh" 2>&1 | tee "$RUNNER_TEMP/service-logs-$t.out"
            rc=${PIPESTATUS[0]}
            set -e
            touch "$stop"
            wait "$collector" || true
            mkdir -p "$RUNNER_TEMP/service-logs/$t"
            mv "$RUNNER_TEMP/service-logs-$t.out" "$RUNNER_TEMP/service-logs/$t/test-output.txt"
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error::$t 失败(退出码 $rc)"
              exit "$rc"
            fi
          done

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-service-logs
          path: ${{ runner.temp }}/service-logs/
          if-no-files-found: ignore
