name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      # setup-uv 不发布 v10 这类浮动大版本 tag,只能钉完整版本
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          working-directory: server
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      # testcontainers 在 runner 自带的 Docker 上起 postgres:16-alpine / redis:7-alpine
      - name: Pytest
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b

      - name: Vitest
        run: npm run test

  # Playwright e2e 冒烟(npm run e2e)需要先起数据库、后端和前端,M2a 段 D 完成后再加一个 job。
