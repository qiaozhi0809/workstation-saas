name: CI

# 纯文档改动不跑 CI。main 目前没开分支保护;以后若把 CI 设为必须通过的检查,
# 要改成任务级跳过(否则纯文档 PR 会一直等待检查)。
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'reference-html/**'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'reference-html/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      # setup-uv 不发布 v10 这类浮动大版本 tag,只能钉完整版本
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          working-directory: server
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      # testcontainers 在 runner 自带的 Docker 上起 postgres:16-alpine / redis:7-alpine
      - name: Pytest
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

      - name: Typecheck
        run: npx tsc -b

      - name: Vitest
        run: npm run test

  # Playwright e2e 冒烟:真实 Postgres/Redis + 后端 + Vite dev server(/api 代理到 8080)
  # + 假摄像头(mediamtx + H.264 / H.265 推流)+ stream worker:m5c 的监控用例与 pytest 真 ffmpeg 组在这里跑
  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    # 比只跑 Playwright 时多了装 ffmpeg、拉假摄像头镜像、两次 testcontainers 的 pytest 与真流用例
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workstation
          POSTGRES_PASSWORD: workstation
          POSTGRES_DB: workstation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workstation -d workstation"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # 没有 server/.env;WS_ENV 默认是 prod(L167),alembic / cli / uvicorn 都要显式 dev 才能起
      WS_ENV: dev
      # 与 deploy/docker-compose.dev.yml 和 server/app/config.py 的开发默认值一致
      WS_DATABASE_URL: postgresql+psycopg://workstation:workstation@localhost:5432/workstation
      WS_REDIS_URL: redis://localhost:6379/0
      # 假摄像头(mediamtx)映射到 runner 的 RTSP 端口:后端、stream worker、pytest 真 ffmpeg 组、Playwright 都用它
      WS_RTSP_PORT: "8554"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          working-directory: server
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # stream worker 与 pytest 真 ffmpeg 组要 ffmpeg / ffprobe;假摄像头只起 camera profile 的三个服务——
      # dev compose 里的 postgres / redis 与上面的 GitHub services 用同样的端口,不能一起起。先起容器,后面的步骤给它时间推流
      # runner 的 apt 镜像偶尔整段时间不响应(2026-11-06 一下午三次,换 archive.ubuntu.com 也没用),
      # 所以把 ffmpeg 及其依赖的 .deb 按 runner 镜像版本缓存:命中就本地安装、完全不碰镜像;
      # 没命中才走 apt,每次尝试限时 4 分钟、失败换镜像,三次都不行再红,装成功后把 .deb 存进缓存
      - name: Restore cached ffmpeg packages
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-debs
          key: ffmpeg-debs-${{ runner.os }}-${{ env.ImageOS }}-${{ env.ImageVersion }}

      - name: Install ffmpeg
        run: |
          set -u
          mkdir -p ~/ffmpeg-debs
          if ls ~/ffmpeg-debs/*.deb >/dev/null 2>&1; then
            if sudo timeout 240 apt-get install -y -qq --no-install-recommends ~/ffmpeg-debs/*.deb; then
              echo "ffmpeg 来自缓存($(ls ~/ffmpeg-debs/*.deb | wc -l) 个 .deb)"; ffmpeg -version | head -n 1; exit 0
            fi
            echo "::warning::缓存的 .deb 装不上(runner 镜像变了?),改走 apt"
            rm -f ~/ffmpeg-debs/*.deb
          fi
          apt_try() {
            sudo timeout 240 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update -qq \
              && sudo timeout 240 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y -qq --no-install-recommends ffmpeg
          }
          for attempt in 1 2 3; do
            if apt_try; then
              # apt-get 默认保留下载的 .deb;存进缓存目录,下次同一镜像版本直接本地装
              cp /var/cache/apt/archives/*.deb ~/ffmpeg-debs/ 2>/dev/null || true
              echo "已缓存 $(ls ~/ffmpeg-debs/*.deb 2>/dev/null | wc -l) 个 .deb 供下次使用"
              ffmpeg -version | head -n 1; exit 0
            fi
            echo "::warning::apt 第 $attempt 次失败(镜像慢或不可达),切换镜像后重试"
            sudo sed -i 's#https\?://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' \
              /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
            sleep 10
          done
          echo "::error::ffmpeg 安装三次都失败,重跑本 job"
          exit 1

      - name: Start fake cameras
        run: docker compose -f deploy/docker-compose.dev.yml --profile camera up -d mediamtx fake-camera fake-camera-hevc

      # 后端(发片段)与 stream worker(写片段)都跑在 runner 上,HLS 目录必须是同一个;
      # job 级 env 里用不了 runner 上下文,写进 GITHUB_ENV 给后面每一步
      - name: Prepare HLS directory
        run: |
          mkdir -p "$RUNNER_TEMP/ws-hls"
          echo "WS_HLS_ROOT=$RUNNER_TEMP/ws-hls" >> "$GITHUB_ENV"

      - name: Install backend dependencies
        working-directory: server
        run: uv sync --locked

      - name: Migrate and seed
        working-directory: server
        run: uv run alembic upgrade head && uv run python -m app.cli seed-dev

      # 假 AI 服务:只监听本机,E2E 绝不连外网;Key 是假值
      - name: Start fake LLM and configure AI
        working-directory: server
        run: |
          nohup node ../apps/web/e2e/helpers/fakeLlm.mjs > "$RUNNER_TEMP/fakellm.log" 2>&1 &
          printf 'test-key\n' | uv run python -m app.cli ai-config set --provider custom --base-url http://127.0.0.1:18089/v1 --model fake-model --api-key-stdin

      - name: Start backend
        working-directory: server
        run: |
          nohup uv run uvicorn --factory app.main:create_app --port 8080 > "$RUNNER_TEMP/backend.log" 2>&1 &

      # 转流 worker:扫 ws:cam:want:* 起 ffmpeg 写 HLS、回答"测试连接";WS_ENV=dev 才放行回环地址的摄像头。
      # 心跳文件显式放到 RUNNER_TEMP,Wait for services 据此确认 worker 真的在跑(而不只是进程起了)
      - name: Start stream worker
        working-directory: server
        run: |
          export WS_STREAM_HEARTBEAT="$RUNNER_TEMP/ws-stream-alive"
          echo "WS_STREAM_HEARTBEAT=$WS_STREAM_HEARTBEAT" >> "$GITHUB_ENV"
          nohup uv run python -m app.stream > "$RUNNER_TEMP/stream.log" 2>&1 &

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      # m5c project 用 runner 预装的 Google Chrome(channel: chrome):Playwright 自带的 Chromium 没有 H.264 解码器,
      # 真流用例放不出画面。这里只确认它在,不重装
      - name: Install Playwright browser
        working-directory: apps/web
        run: |
          npx playwright install --with-deps chromium
          google-chrome --version

      - name: Start frontend
        working-directory: apps/web
        run: |
          nohup npm run dev > "$RUNNER_TEMP/frontend.log" 2>&1 &

      - name: Wait for services
        run: |
          wait_for() {
            for _ in $(seq 1 60); do
              if curl -sf -o /dev/null "$1"; then
                echo "$1 is up"
                return 0
              fi
              sleep 2
            done
            echo "Timed out waiting for $1"
            echo "--- backend.log ---"; cat "$RUNNER_TEMP/backend.log" || true
            echo "--- frontend.log ---"; cat "$RUNNER_TEMP/frontend.log" || true
            echo "--- fakellm.log ---"; cat "$RUNNER_TEMP/fakellm.log" || true
            return 1
          }
          # 转流 worker 没有 HTTP 接口:它每秒 touch 一次 WS_STREAM_HEARTBEAT,文件出现即视为活着(最多 60 秒)
          wait_for_file() {
            for _ in $(seq 1 30); do
              if [ -f "$1" ]; then
                echo "$1 exists"
                return 0
              fi
              sleep 2
            done
            echo "Timed out waiting for $1"
            return 1
          }
          # mediamtx 没有 HTTP 健康接口:先等 RTSP 端口可连(最多 60 秒),再用 ffprobe 确认推流到位
          wait_rtsp_port() {
            for _ in $(seq 1 30); do
              if (echo > "/dev/tcp/127.0.0.1/$WS_RTSP_PORT") 2>/dev/null; then
                echo "rtsp port $WS_RTSP_PORT is open"
                return 0
              fi
              sleep 2
            done
            echo "Timed out waiting for rtsp port $WS_RTSP_PORT"
            return 1
          }
          # 15 次 × (ffprobe 最多 4 秒 + 歇 2 秒) ≈ 90 秒封顶;cam2 起不来时不能把整个 job 拖住
          wait_rtsp_stream() {
            for _ in $(seq 1 15); do
              if timeout 4 ffprobe -v error -rtsp_transport tcp -i "rtsp://127.0.0.1:$WS_RTSP_PORT/$1" -show_streams > /dev/null 2>&1; then
                echo "rtsp stream $1 is up"
                return 0
              fi
              sleep 2
            done
            echo "Timed out waiting for rtsp stream $1"
            return 1
          }
          wait_for http://127.0.0.1:18089/last
          wait_for http://localhost:8080/api/v1/healthz
          wait_for http://localhost:5173/
          wait_for http://localhost:5173/api/v1/healthz
          wait_for_file "$WS_STREAM_HEARTBEAT" || {
            echo "::error::转流 worker 没有心跳"
            echo "--- stream.log ---"; cat "$RUNNER_TEMP/stream.log" || true
            exit 1
          }
          wait_rtsp_port
          # cam1(H.264)是所有真流用例的前提,起不来就中止;cam2(H.265)的推流镜像可能没有 libx265,
          # 起不来只告警——m5c.spec 的 HEVC 用例会据此 skip,由后续段决定是否换镜像
          wait_rtsp_stream cam1 || {
            echo "::error::假摄像头 cam1 没有推流"
            docker compose -f deploy/docker-compose.dev.yml --profile camera logs --tail 50 || true
            exit 1
          }
          wait_rtsp_stream cam2 || echo "::warning::H.265 假摄像头 cam2 不可用(镜像可能没有 libx265),m5c 的 HEVC 用例会跳过"

      - name: Playwright e2e
        working-directory: apps/web
        run: npm run e2e -- --trace retain-on-failure

      # R7:真 ffmpeg 组需要 ffmpeg + 假摄像头,只有这里具备(backend job 里 skip)。放在 Playwright 之后:
      # 它和 Playwright 的真流用例都要起 ffmpeg 拉同一路 cam1,先跑完浏览器用例再跑它,互不抢 CPU;
      # 仍是必过步骤(没有 continue-on-error)。性能冒烟另起一步
      - name: Pytest ffmpeg group
        working-directory: server
        run: uv run pytest -m "ffmpeg and not perf" -q

      # L176:3 路 copy + 1 路转码跑 30 秒,PERF 一行进 perf.txt 作为 artifact;只给数字、不拦截 job。
      # 显式 bash 带 pipefail,pytest 的退出码不会被 tee 吞掉(失败在这一步显示为告警)
      - name: Stream perf smoke
        working-directory: server
        shell: bash
        continue-on-error: true
        run: uv run pytest -m perf -q -s | tee "$RUNNER_TEMP/perf.txt"

      - name: Upload stream perf result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-perf
          path: ${{ runner.temp }}/perf.txt
          if-no-files-found: ignore

      - name: Show service logs
        if: failure()
        run: |
          echo "--- backend.log ---"; cat "$RUNNER_TEMP/backend.log" || true
          echo "--- frontend.log ---"; cat "$RUNNER_TEMP/frontend.log" || true
          echo "--- fakellm.log ---"; cat "$RUNNER_TEMP/fakellm.log" || true
          echo "--- stream.log ---"; cat "$RUNNER_TEMP/stream.log" || true
          echo "--- fake cameras ---"; docker compose -f deploy/docker-compose.dev.yml --profile camera logs --tail 50 || true

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore

  # 离线包 + 部署冒烟:构建 0.0.0-ci 离线包,解开后对解开的目录逐个跑部署测试
  # (真实 docker compose,端口 18080/18443,固定子网 172.30.0.0/24 → 脚本必须逐个跑,不能并行)
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # 显式 bash:-eo pipefail。默认的 `bash -e` 没有 pipefail,`脚本 | tee` 会吞掉脚本的退出码
    defaults:
      run:
        shell: bash
    env:
      WS_TEST_VERSION: 0.0.0-ci
      WS_TEST_PROJECT: ws-m5a-ci
      WS_HTTP_PORT: 18080
      WS_HTTPS_PORT: 18443
    steps:
      - uses: actions/checkout@v7

      # runner 自带 shellcheck;-S warning 与本地、计划一致
      - name: Shellcheck
        # -x 跟进 source 进来的文件(与段 B 本地一致)
        run: shellcheck -S warning -x deploy/prod/scripts/*.sh deploy/tests/*.sh deploy/release/*.sh

      - name: Build offline bundle
        run: deploy/release/build-bundle.sh "$WS_TEST_VERSION"

      - name: Bundle smoke
        run: deploy/tests/bundle_smoke.sh "$WS_TEST_VERSION"

      - name: Unpack bundle
        run: |
          mkdir -p "$RUNNER_TEMP/bundle"
          tar -xzf "dist/workstation-deploy-$WS_TEST_VERSION.tar.gz" -C "$RUNNER_TEMP/bundle"
          echo "WS_TEST_DEPLOY_SRC=$RUNNER_TEMP/bundle/workstation-deploy-$WS_TEST_VERSION" >> "$GITHUB_ENV"
          echo "WS_BUNDLE_PKG=$PWD/dist/workstation-deploy-$WS_TEST_VERSION.tar.gz" >> "$GITHUB_ENV"

      # 删掉本机构建出的镜像:离线包是唯一来源。bundle_upgrade 排在第一个,它真的 docker load 包里的镜像 tar,
      # 之后的测试沿用已载入的镜像(_common.sh 的 WS_INSTALL_SKIP_LOAD=1)
      - name: Remove locally built images
        run: docker image rm "workstation-app:$WS_TEST_VERSION" "workstation-web:$WS_TEST_VERSION" "workstation-stream:$WS_TEST_VERSION" postgres:16-alpine redis:7-alpine

      # 一个脚本一个脚本地跑;每个脚本后台抓各服务日志,失败时作为 artifact 上传
      - name: Deploy tests
        run: |
          for t in bundle_upgrade install_fresh install_twice backup_restore restore_rejects upgrade_same upgrade_precheck_fail; do
            echo "::group::$t"
            stop="$RUNNER_TEMP/stop-$t"
            deploy/tests/bundle_collect_logs.sh "$WS_TEST_PROJECT" "$RUNNER_TEMP/service-logs/$t" "$stop" &
            collector=$!
            rc=0
            set +e
            "deploy/tests/$t.sh" 2>&1 | tee "$RUNNER_TEMP/service-logs-$t.out"
            rc=${PIPESTATUS[0]}
            set -e
            touch "$stop"
            wait "$collector" || true
            mkdir -p "$RUNNER_TEMP/service-logs/$t"
            mv "$RUNNER_TEMP/service-logs-$t.out" "$RUNNER_TEMP/service-logs/$t/test-output.txt"
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error::$t 失败(退出码 $rc)"
              exit "$rc"
            fi
          done

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-service-logs
          path: ${{ runner.temp }}/service-logs/
          if-no-files-found: ignore

  # 升级路径(段 O,L117 / L179 / L190):两个较慢的部署测试,独立于 deploy job,在 main / tag / PR 上跑
  #   upgrade_rollback.sh      升级失败后 rollback.sh 回退、kill -9 中断后的提示与回退
  #   upgrade_from_previous.sh 从上一个发布 tag 构建旧离线包装一套,再用本提交的包升级(真实跨版本迁移)
  # 版本号用 1.0.0-ci:旧包是 0.7.2-ci,upgrade.sh 只放行 0.x → 1.x 这一种大版本跳跃。
  # tag 不存在时跨版本测试打 ::warning 并以 0 退出,job 仍为绿;打完 tag 后重跑即跑全。
  deploy-upgrade-path:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'pull_request'
    defaults:
      run:
        shell: bash
    env:
      WS_TEST_VERSION: 1.0.0-ci
      WS_TEST_PROJECT: ws-m5a-up
      WS_HTTP_PORT: 18080
      WS_HTTPS_PORT: 18443
      WS_PREVIOUS_TAG: v0.7.2-m5c-cameras
      WS_PREVIOUS_VERSION: 0.7.2-ci
      # 升级后 alembic_version 必须停在这一版(A2 的 0013);以后 main 上新增迁移时同步改
      WS_EXPECTED_MIGRATION: "0013"
    steps:
      # 需要 tag 与完整历史:旧包从 tag 的 worktree 构建
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build current bundle
        run: deploy/release/build-bundle.sh "$WS_TEST_VERSION"

      - name: Unpack current bundle
        run: |
          mkdir -p "$RUNNER_TEMP/bundle"
          tar -xzf "dist/workstation-deploy-$WS_TEST_VERSION.tar.gz" -C "$RUNNER_TEMP/bundle"
          echo "WS_TEST_DEPLOY_SRC=$RUNNER_TEMP/bundle/workstation-deploy-$WS_TEST_VERSION" >> "$GITHUB_ENV"
          echo "WS_BUNDLE_PKG=$PWD/dist/workstation-deploy-$WS_TEST_VERSION.tar.gz" >> "$GITHUB_ENV"

      # 旧包:tag 存在才构建(用 tag 那一版自己的 build-bundle.sh 与 Dockerfile),否则留空让测试跳过
      - name: Build previous bundle from tag
        run: |
          if git rev-parse -q --verify "refs/tags/$WS_PREVIOUS_TAG^{commit}" >/dev/null; then
            git worktree add "$RUNNER_TEMP/prev" "$WS_PREVIOUS_TAG"
            (cd "$RUNNER_TEMP/prev" && deploy/release/build-bundle.sh "$WS_PREVIOUS_VERSION")
            mkdir -p "$RUNNER_TEMP/prev-bundle"
            tar -xzf "$RUNNER_TEMP/prev/dist/workstation-deploy-$WS_PREVIOUS_VERSION.tar.gz" -C "$RUNNER_TEMP/prev-bundle"
            echo "WS_PREVIOUS_DEPLOY_SRC=$RUNNER_TEMP/prev-bundle/workstation-deploy-$WS_PREVIOUS_VERSION" >> "$GITHUB_ENV"
            # 旧包构建出的镜像由测试从旧包的 images/ 里 docker load;这里删掉本机构建出的,证明用的是包里的
            docker image rm "workstation-app:$WS_PREVIOUS_VERSION" "workstation-web:$WS_PREVIOUS_VERSION" "workstation-stream:$WS_PREVIOUS_VERSION"
          else
            echo "::warning::tag $WS_PREVIOUS_TAG 不存在,跳过跨版本升级测试(协调者打完 tag 后重跑本 job)"
          fi

      # 与 deploy job 同样的方式逐个跑;失败时上传各服务日志
      - name: Upgrade path tests
        run: |
          for t in upgrade_rollback upgrade_from_previous; do
            echo "::group::$t"
            stop="$RUNNER_TEMP/stop-$t"
            deploy/tests/bundle_collect_logs.sh "$WS_TEST_PROJECT" "$RUNNER_TEMP/service-logs/$t" "$stop" &
            collector=$!
            rc=0
            set +e
            "deploy/tests/$t.sh" 2>&1 | tee "$RUNNER_TEMP/service-logs-$t.out"
            rc=${PIPESTATUS[0]}
            set -e
            touch "$stop"
            wait "$collector" || true
            mkdir -p "$RUNNER_TEMP/service-logs/$t"
            mv "$RUNNER_TEMP/service-logs-$t.out" "$RUNNER_TEMP/service-logs/$t/test-output.txt"
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error::$t 失败(退出码 $rc)"
              exit "$rc"
            fi
          done

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-upgrade-path-service-logs
          path: ${{ runner.temp }}/service-logs/
          if-no-files-found: ignore
