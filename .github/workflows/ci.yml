name: CI

# 纯文档改动不跑 CI。main 目前没开分支保护;以后若把 CI 设为必须通过的检查,
# 要改成任务级跳过(否则纯文档 PR 会一直等待检查)。
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'reference-html/**'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'reference-html/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      # setup-uv 不发布 v10 这类浮动大版本 tag,只能钉完整版本
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          working-directory: server
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      # testcontainers 在 runner 自带的 Docker 上起 postgres:16-alpine / redis:7-alpine
      - name: Pytest
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

      - name: Typecheck
        run: npx tsc -b

      - name: Vitest
        run: npm run test

  # Playwright e2e 冒烟:真实 Postgres/Redis + 后端 + Vite dev server(/api 代理到 8080)
  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workstation
          POSTGRES_PASSWORD: workstation
          POSTGRES_DB: workstation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workstation -d workstation"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # 与 deploy/docker-compose.dev.yml 和 server/app/config.py 的开发默认值一致
      WS_DATABASE_URL: postgresql+psycopg://workstation:workstation@localhost:5432/workstation
      WS_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          working-directory: server
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: uv sync --locked

      - name: Migrate and seed
        working-directory: server
        run: uv run alembic upgrade head && uv run python -m app.cli seed-dev

      # 假 AI 服务:只监听本机,E2E 绝不连外网;Key 是假值
      - name: Start fake LLM and configure AI
        working-directory: server
        run: |
          nohup node ../apps/web/e2e/helpers/fakeLlm.mjs > "$RUNNER_TEMP/fakellm.log" 2>&1 &
          printf 'test-key\n' | uv run python -m app.cli ai-config set --provider custom --base-url http://127.0.0.1:18089/v1 --model fake-model --api-key-stdin

      - name: Start backend
        working-directory: server
        run: |
          nohup uv run uvicorn --factory app.main:create_app --port 8080 > "$RUNNER_TEMP/backend.log" 2>&1 &

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Start frontend
        working-directory: apps/web
        run: |
          nohup npm run dev > "$RUNNER_TEMP/frontend.log" 2>&1 &

      - name: Wait for services
        run: |
          wait_for() {
            for _ in $(seq 1 60); do
              if curl -sf -o /dev/null "$1"; then
                echo "$1 is up"
                return 0
              fi
              sleep 2
            done
            echo "Timed out waiting for $1"
            echo "--- backend.log ---"; cat "$RUNNER_TEMP/backend.log" || true
            echo "--- frontend.log ---"; cat "$RUNNER_TEMP/frontend.log" || true
            echo "--- fakellm.log ---"; cat "$RUNNER_TEMP/fakellm.log" || true
            return 1
          }
          wait_for http://127.0.0.1:18089/last
          wait_for http://localhost:8080/api/v1/healthz
          wait_for http://localhost:5173/
          wait_for http://localhost:5173/api/v1/healthz

      - name: Playwright e2e
        working-directory: apps/web
        run: npm run e2e -- --trace retain-on-failure

      - name: Show service logs
        if: failure()
        run: |
          echo "--- backend.log ---"; cat "$RUNNER_TEMP/backend.log" || true
          echo "--- frontend.log ---"; cat "$RUNNER_TEMP/frontend.log" || true
          echo "--- fakellm.log ---"; cat "$RUNNER_TEMP/fakellm.log" || true

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
